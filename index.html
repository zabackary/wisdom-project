<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisdom Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        background-color: #000;
      }
      .container,
      .loading-container {
        width: 960px;
        height: 720px;
        background-color: #fff;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        overflow: hidden;
      }
      .container {
        position: fixed;
        /* border-radius: 12px;
        overflow: hidden; */
      }
      #loading-progress,
      .loading-container,
      canvas,
      img {
        position: absolute;
      }
      canvas {
        inset: 0;
        width: 960px;
        height: 720px;
      }
      #loading-progress {
        width: 156px;
        height: 24px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffa5a8;
        background-color: #000;
        text-align: center;
        font-family: "Titillium Web", serif;
        border-radius: 999px;
        overflow: hidden;
      }
      #loading-progress::before {
        position: absolute;
        content: "";
        top: 0;
        left: 0;
        height: 100%;
        width: calc(100% * var(--progress));
        background-color: #ffa5a8;
        transition: width 0.2s;
        border-radius: 999px;
      }
      @keyframes loading-tip-reveal {
        0% {
          opacity: 0;
        }
        80% {
          opacity: 0;
          transform: translate(-50%, 50px);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      #loading-tip {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #000;
        font-family: "Titillium Web", serif;
        font-size: 12px;
        text-align: center;
        background-color: #d1b3b3;
        padding: 4px 8px;
        border-radius: 999px;
        animation: loading-tip-reveal 5s ease-in-out forwards;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="loading-container">
        <div id="loading-progress" style="--progress: 0">loading</div>
        <div id="loading-tip">
          If the animation doesn't load, please ensure that the browser you are
          using supports the ECMAScript 2022 standard. Specifically, your
          browser should support top-level await.
        </div>
      </div>
      <canvas></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
